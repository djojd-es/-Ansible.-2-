---
- name: Install and enable tuned daemon
  hosts: all
  become: yes
  vars:
    tuned_service: tuned

  tasks:
    - name: Install tuned package
      ansible.builtin.package:
        name: "{{ tuned_service }}"
        state: present

    - name: Ensure tuned service is started and enabled
      ansible.builtin.service:
        name: "{{ tuned_service }}"
        state: started
        enabled: yes